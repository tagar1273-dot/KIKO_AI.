
name: Build KIKO AI APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build KIKO Android APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout KIKO Project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find Android SDK Manager
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK Manager not found"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "Found: $SDKMANAGER"

      - name: Accept Android Licenses
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses || true

      - name: Install Android SDK Packages
        run: |
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build KIKO Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload KIKO APK
        uses: actions/upload-artifact@v4
        with:
          name: KIKO-AI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
